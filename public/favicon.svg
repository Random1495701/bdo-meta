<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="BDO Meta">
  <title>BDO Meta</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%"  stop-color="#1a1612"/>
      <stop offset="55%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fbe48a"/>
      <stop offset="35%"  stop-color="#f0d060"/>
      <stop offset="65%"  stop-color="#c8aa44"/>
      <stop offset="100%" stop-color="#7e6320"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7e6320"/>
      <stop offset="50%"  stop-color="#fbe48a"/>
      <stop offset="100%" stop-color="#7e6320"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7e6320"/>
      <stop offset="50%"  stop-color="#fbe48a"/>
      <stop offset="100%" stop-color="#7e6320"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#c8aa44" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background disc -->
  <circle cx="24" cy="24" r="24" fill="url(#bg)"/>

  <!-- Static amber halo (favicons typically don't animate) -->
  <circle cx="24" cy="25" r="17" fill="url(#halo)" opacity="0.6"/>

  <!-- Outer gold ring (thicker for favicon legibility) -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#gold)" stroke-width="1.4"/>

  <!-- Cardinal ornaments (N/E/S/W) -->
  <g fill="url(#gold)">
    <path d="M24 0.6 L26.6 4 L24 7.4 L21.4 4 Z"/>
    <path d="M24 40.6 L26.6 44 L24 47.4 L21.4 44 Z"/>
    <path d="M0.6 24 L4 21.4 L7.4 24 L4 26.6 Z"/>
    <path d="M40.6 24 L44 21.4 L47.4 24 L44 26.6 Z"/>
  </g>

  <!-- Inner dark seal -->
  <circle cx="24" cy="24" r="16" fill="#0a0908" opacity="0.55"/>
  <circle cx="24" cy="24" r="16" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.6"/>

  <!-- Pommel jewel -->
  <circle cx="24" cy="9.6" r="2" fill="url(#gold)"/>
  <circle cx="24" cy="9.6" r="0.95" fill="#fbbf24"/>

  <!-- Grip -->
  <rect x="23" y="11.3" width="2" height="3.9" fill="url(#gold)"/>

  <!-- Cross-guard -->
  <path d="M13 16.3 Q11.8 16.3 11.8 17.5 Q11.8 18.7 13.3 18.7 L34.7 18.7 Q36.2 18.7 36.2 17.5 Q36.2 16.3 35 16.3 Z"
        fill="url(#goldH)"/>
  <path d="M24 15.1 L26.2 17.5 L24 19.9 L21.8 17.5 Z" fill="url(#gold)"/>
  <circle cx="12.5" cy="17.5" r="1.2" fill="url(#gold)"/>
  <circle cx="35.5" cy="17.5" r="1.2" fill="url(#gold)"/>

  <!-- Blade -->
  <path d="M23 19.7 L25 19.7 L25 37.4 L24 39.8 L23 37.4 Z" fill="url(#blade)"/>

  <!-- B arcs -->
  <path d="M25 22 Q31.5 22.8 31.5 26.6 Q31.5 30.4 25 31"
        fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M25 30.6 Q32.5 31.4 32.5 35.2 Q32.5 39 25 39.6"
        fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="31.5" cy="26.6" r="1.05" fill="#f0d060"/>
  <circle cx="32.5" cy="35.2" r="1.05" fill="#f0d060"/>
</svg>
