<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="BDO Meta">
  <title>BDO Meta</title>
  <desc>Ornate occult seal: a planted crusader sword forming the spine of a stylized B monogram, encircled by gold filigree.</desc>
  <defs>
    <style>
      .halo { animation: bdo-glow-pulse 4.5s ease-in-out infinite; }
      .ember { animation: bdo-ember-flicker 3.2s ease-in-out infinite; }
      @keyframes bdo-glow-pulse {
        0%, 100% { opacity: 0.30; }
        50%      { opacity: 0.85; }
      }
      @keyframes bdo-ember-flicker {
        0%, 100% { opacity: 0.55; }
        35%      { opacity: 0.95; }
        70%      { opacity: 0.70; }
      }
      @media (prefers-reduced-motion: reduce) {
        .halo  { animation: none; opacity: 0.55; }
        .ember { animation: none; opacity: 0.75; }
      }
    </style>

    <!-- Dark amber-tinted background (BDO black-sun vibe) -->
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%"  stop-color="#1a1612"/>
      <stop offset="55%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>

    <!-- Vertical gold gradient (bright top → deep bottom) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fbe48a"/>
      <stop offset="35%"  stop-color="#f0d060"/>
      <stop offset="65%"  stop-color="#c8aa44"/>
      <stop offset="100%" stop-color="#7e6320"/>
    </linearGradient>

    <!-- Horizontal gold gradient (for cross-guard) -->
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7e6320"/>
      <stop offset="20%"  stop-color="#c8aa44"/>
      <stop offset="50%"  stop-color="#fbe48a"/>
      <stop offset="80%"  stop-color="#c8aa44"/>
      <stop offset="100%" stop-color="#7e6320"/>
    </linearGradient>

    <!-- Blade gradient (steel-gold sheen) -->
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7e6320"/>
      <stop offset="50%"  stop-color="#fbe48a"/>
      <stop offset="100%" stop-color="#7e6320"/>
    </linearGradient>

    <!-- Amber halo behind emblem (pulses) -->
    <radialGradient id="halo" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#c8aa44" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background disc (so the seal reads on any backdrop) -->
  <circle cx="24" cy="24" r="24" fill="url(#bg)"/>

  <!-- Pulsing amber halo behind the central emblem -->
  <circle class="halo" cx="24" cy="25" r="17" fill="url(#halo)"/>

  <!-- ===== Ornate outer frame ===== -->
  <!-- Outer thick gold ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#gold)" stroke-width="1.1"/>
  <!-- Inner thin gold ring (engraved look) -->
  <circle cx="24" cy="24" r="19.4" fill="none" stroke="url(#gold)" stroke-width="0.45" opacity="0.7"/>

  <!-- Cardinal ornaments (N/E/S/W) — ornate diamond/leaf shapes -->
  <g fill="url(#gold)">
    <path d="M24 0.8 L26.4 4 L24 7.2 L21.6 4 Z"/>
    <path d="M24 40.8 L26.4 44 L24 47.2 L21.6 44 Z"/>
    <path d="M0.8 24 L4 21.6 L7.2 24 L4 26.4 Z"/>
    <path d="M40.8 24 L44 21.6 L47.2 24 L44 26.4 Z"/>
  </g>
  <!-- Inner accent dots on cardinal ornaments -->
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="24" cy="4" r="0.7"/>
    <circle cx="24" cy="44" r="0.7"/>
    <circle cx="4" cy="24" r="0.7"/>
    <circle cx="44" cy="24" r="0.7"/>
  </g>

  <!-- Diagonal runic ticks (NE/SE/SW/NW) -->
  <g fill="url(#gold)" opacity="0.75">
    <rect x="23.3" y="1.8" width="1.4" height="2.6" rx="0.35" transform="rotate(45 24 24)"/>
    <rect x="23.3" y="1.8" width="1.4" height="2.6" rx="0.35" transform="rotate(135 24 24)"/>
    <rect x="23.3" y="1.8" width="1.4" height="2.6" rx="0.35" transform="rotate(225 24 24)"/>
    <rect x="23.3" y="1.8" width="1.4" height="2.6" rx="0.35" transform="rotate(315 24 24)"/>
  </g>

  <!-- Inner seal (recessed dark disc) -->
  <circle cx="24" cy="24" r="16" fill="#0a0908" opacity="0.55"/>
  <circle cx="24" cy="24" r="16" fill="none" stroke="url(#gold)" stroke-width="0.4" opacity="0.55"/>

  <!-- ===== Central emblem: sword-as-B-spine ===== -->

  <!-- Pommel jewel (top) -->
  <circle cx="24" cy="9.6" r="1.9" fill="url(#gold)"/>
  <circle class="ember" cx="24" cy="9.6" r="0.9" fill="#fbbf24"/>
  <circle cx="23.6" cy="9.2" r="0.35" fill="#fffbe0" opacity="0.9"/>

  <!-- Grip (wrapped hilt) -->
  <rect x="23.1" y="11.3" width="1.8" height="3.8" fill="url(#gold)"/>
  <g stroke="#5e4717" stroke-width="0.28" opacity="0.85">
    <line x1="23.1" y1="12.1" x2="24.9" y2="12.1"/>
    <line x1="23.1" y1="12.9" x2="24.9" y2="12.9"/>
    <line x1="23.1" y1="13.7" x2="24.9" y2="13.7"/>
    <line x1="23.1" y1="14.5" x2="24.9" y2="14.5"/>
  </g>

  <!-- Cross-guard (swept quillons + center diamond) -->
  <path d="M13.5 16.4 Q12.4 16.4 12.4 17.5 Q12.4 18.6 13.8 18.6 L34.2 18.6 Q35.6 18.6 35.6 17.5 Q35.6 16.4 34.5 16.4 Z"
        fill="url(#goldH)"/>
  <!-- Guard center diamond -->
  <path d="M24 15.3 L26 17.5 L24 19.7 L22 17.5 Z" fill="url(#gold)"/>
  <!-- Quillon end caps (small orbs) -->
  <circle cx="13" cy="17.5" r="1.1" fill="url(#gold)"/>
  <circle cx="35" cy="17.5" r="1.1" fill="url(#gold)"/>
  <circle cx="13" cy="17.5" r="0.4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="35" cy="17.5" r="0.4" fill="#fbbf24" opacity="0.8"/>

  <!-- Blade (tapering to a planted point at bottom) -->
  <path d="M23.1 19.7 L24.9 19.7 L24.9 37.4 L24 39.6 L23.1 37.4 Z" fill="url(#blade)"/>
  <!-- Blade fuller (center groove) -->
  <line x1="24" y1="20.6" x2="24" y2="36.6" stroke="#5e4717" stroke-width="0.32" opacity="0.65"/>
  <!-- Blade highlight -->
  <line x1="23.5" y1="20.6" x2="23.5" y2="36.6" stroke="#fffbe0" stroke-width="0.18" opacity="0.45"/>

  <!-- Small ground burst at blade tip (planted-sword motif) -->
  <g fill="url(#gold)" opacity="0.55">
    <path d="M21.5 38.4 L24 39.2 L26.5 38.4 L25.6 39.8 L24 40.4 L22.4 39.8 Z"/>
  </g>

  <!-- ===== "B" arcs on the right (the two bumps of the B) ===== -->
  <!-- Upper bump -->
  <path d="M24.9 22.2 Q31.2 23 31.2 26.6 Q31.2 30.2 24.9 30.8"
        fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Lower bump -->
  <path d="M24.9 30.4 Q32.2 31.2 32.2 35 Q32.2 38.8 24.9 39.4"
        fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Bump accent gems -->
  <circle cx="31.2" cy="26.6" r="0.95" fill="#f0d060"/>
  <circle cx="32.2" cy="35"   r="0.95" fill="#f0d060"/>
  <circle cx="31.2" cy="26.6" r="0.4"  fill="#fbbf24" opacity="0.9"/>
  <circle cx="32.2" cy="35"   r="0.4"  fill="#fbbf24" opacity="0.9"/>
</svg>
